[package]
name = "vleer"
description = "Music, but without the subscription."
version = "0.1.0"
edition = "2024"
authors = ["PandaDEV <hello@pandadev.net>"]
homepage = "https://vleer.app"
repository = "https://github.com/vleerapp/vleer"
license = "AGPL-3.0"
categories = ["multimedia::audio"]

[dependencies]
gpui = { package = "gpui-unofficial", version = "1.20.2" }
gpui-platform-gpui-unofficial = { version = "1.20.2", features = [
  "font-kit",
  "x11",
  "wayland",
  "runtime_shaders",
] }
anyhow = "1.0.104"
dirs = "7.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.1", features = ["sync"] }
futures = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
rusqlite_migration = { version = "2.6.0", features = ["from-directory"] }
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
rodio = { git = "https://github.com/vleerapp/rodio", rev = "8e5961ca2cc88cbff5f1a5686d8253b6e655ad8d", features = [
  "symphonia",
  "symphonia-all",
] }
symphonia-adapter-libopus = "0.3.0"
cuid2 = "0.1.6"
url = "2.5.8"
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
lofty = "0.25.4"
rayon = "1.12.0"
walkdir = "2.5.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
image = "0.25.10"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
rustc-hash = "2.1.3"
nucleo-matcher = "0.3.1"
unicode-segmentation = "1.13.3"
ureq = { version = "3.4.2", features = ["json"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
semver = "1.0.28"
sequoia-openpgp = { version = "2.4.1", default-features = false, features = [
  "crypto-rust",
  "allow-experimental-crypto",
  "allow-variable-time-crypto",
] }
spectrum-analyzer = "2.0.0"
discord-rich-presence = "1.1.0"
rand = "0.10.3"
raw-window-handle = "0.6.2"
interprocess = "2.4.4"
libc = "0.2.189"
md5 = "0.8.1"

[dev-dependencies]
serde_json = "1.0.151"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.10.0"
zbus = "5.19.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
imagesize = "0.15.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSImage"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3.2", features = [
  "NSData",
  "NSDictionary",
  "NSObject",
  "NSValue",
] }
objc2-media-player = { version = "0.3.2", features = [
  "MPMediaItem",
  "MPNowPlayingInfoCenter",
  "MPRemoteCommand",
  "MPRemoteCommandCenter",
  "MPRemoteCommandEvent",
  "block2",
  "objc2-app-kit",
  "objc2-core-foundation",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Devices_Enumeration",
  "Foundation_Collections",
  "Media",
  "Media_Audio",
  "Media_MediaProperties",
  "Media_Render",
  "Storage_Search",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_System_WinRT",
] }
windows-future = "0.3.2"

[profile.dist]
inherits = "release"
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[package.metadata.packager]
product_name = "Vleer"
description = "Music, but without the subscription."
authors = ["PandaDEV <hello@pandadev.net>"]
homepage = "https://vleer.app"
category = "Music"
identifier = "app.vleerapp.vleer"
before_packaging_command = "cargo build --profile dist"
icons = [
  "assets/images/icon.png",
  "assets/images/icon-512.png",
  "assets/images/icon-256.png",
  "assets/images/icon-128.png",
  "assets/images/icon.icns",
]
out_dir = "target/dist/bundles"
formats = ["dmg", "wix", "appimage"]

[package.metadata.packager.macos]
signing_identity = "-"

[package.metadata.packager.wix]
template = "assets/windows/main.wxs"
